# Шаблон: /etc/nginx/sites-available/zoomersky.info
# root → /opt/zoomersky.info/dist
# API → бекенд (порт при необходимости измените)

server {
    listen 80;
    listen [::]:80;
    server_name zoomersky.info;

    root /opt/zoomersky.info/dist;
    index index.html;

    location /api/landing_v2/ {
        proxy_pass https://bot.zoomersky.online/api/landing_v2/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header Host              bot.zoomersky.online;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
}
